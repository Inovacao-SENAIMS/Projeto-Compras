{% load nomes %}
<form method="get" class="filtros">
    <div class="filtros-grade">
        <div class="filtro-campo">
            <label for="f-responsavel"><i class="bi bi-person"></i> Responsável</label>
            <select id="f-responsavel" name="responsavel" class="campo">
                <option value="">Todos</option>
                {% for u in filtro_responsaveis %}
                <option value="{{ u.pk }}" {% if u.pk|stringformat:"s" == filtro_valores.responsavel %}selected{% endif %}>{{ u|nome_usuario }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="filtro-campo">
            <label for="f-modalidade"><i class="bi bi-list-check"></i> Modalidade (RCA)</label>
            <select id="f-modalidade" name="modalidade" class="campo">
                <option value="">Todas</option>
                {% for valor, rotulo in filtro_modalidades %}
                <option value="{{ valor }}" {% if valor == filtro_valores.modalidade %}selected{% endif %}>{{ rotulo }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="filtro-campo">
            <label><i class="bi bi-calendar-event"></i> Abertura (de/até)</label>
            <div class="filtro-duplo">
                <input type="date" name="abertura_ini" value="{{ filtro_valores.abertura_ini }}" class="campo" title="De">
                <input type="date" name="abertura_fim" value="{{ filtro_valores.abertura_fim }}" class="campo" title="Até">
            </div>
        </div>

        <div class="filtro-campo">
            <label><i class="bi bi-send"></i> Envio (de/até)</label>
            <div class="filtro-duplo">
                <input type="date" name="envio_ini" value="{{ filtro_valores.envio_ini }}" class="campo" title="De">
                <input type="date" name="envio_fim" value="{{ filtro_valores.envio_fim }}" class="campo" title="Até">
            </div>
        </div>

        <div class="filtro-campo">
            <label><i class="bi bi-flag"></i> Encerramento (de/até)</label>
            <div class="filtro-duplo">
                <input type="date" name="encerramento_ini" value="{{ filtro_valores.encerramento_ini }}" class="campo" title="De">
                <input type="date" name="encerramento_fim" value="{{ filtro_valores.encerramento_fim }}" class="campo" title="Até">
            </div>
        </div>

        <div class="filtro-campo">
            <label><i class="bi bi-hourglass-split"></i> Lead time (dias)</label>
            <div class="filtro-duplo">
                <input type="number" min="0" name="lead_min" value="{{ filtro_valores.lead_min }}" class="campo" placeholder="mín.">
                <input type="number" min="0" name="lead_max" value="{{ filtro_valores.lead_max }}" class="campo" placeholder="máx.">
            </div>
        </div>
    </div>

    <div class="filtros-acoes">
        <button type="submit" class="botao"><i class="bi bi-funnel"></i> Filtrar</button>
        <a class="botao botao-exportar" href="{% querystring formato='csv' %}"><i class="bi bi-filetype-csv"></i> Exportar CSV</a>
        {% if filtro_ativo %}<a class="link-secundario" href="{{ request.path }}"><i class="bi bi-x-lg"></i> Limpar</a>{% endif %}
    </div>
</form>
