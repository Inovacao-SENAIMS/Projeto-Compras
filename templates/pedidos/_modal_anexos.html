{% comment %}Modal reutilizável de visualização de anexos.{% endcomment %}
<div class="modal-overlay" id="modal-anexos">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-anexos">
        <div class="modal-cabecalho">
            <h3 id="titulo-anexos">Anexos</h3>
            <button type="button" class="modal-fechar" data-fechar aria-label="Fechar">&times;</button>
        </div>
        <div class="modal-corpo" id="modal-anexos-corpo"></div>
    </div>
</div>
