{% extends "base_auth.html" %}

{% block title %}Entrar - Projeto Compras{% endblock %}

{% block content %}
<div class="login-card">
    <h2>Entrar</h2>
    <p class="meta">Acesse com seu e-mail institucional.</p>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <p>
            <label for="{{ form.username.id_for_label }}">Usuário ou e-mail</label>
            {{ form.username }}
        </p>
        <p>
            <label for="{{ form.password.id_for_label }}">Senha</label>
            {{ form.password }}
        </p>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="botao"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
    </form>

    <p class="login-rodape">
        Não tem conta?
        <a href="{% url 'accounts:cadastro' %}"><i class="bi bi-person-plus"></i> Cadastre-se</a>
    </p>
</div>
{% endblock %}
