{% comment %}Modal para a Gestão designar/alterar o responsável (selecionar o usuário).{% endcomment %}
<div class="modal-overlay" id="modal-designar">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-designar">
        <div class="modal-cabecalho">
            <h3 id="titulo-designar">Selecionar responsável</h3>
            <button type="button" class="modal-fechar" data-fechar aria-label="Fechar">&times;</button>
        </div>
        <form method="post" id="form-designar" class="formulario formulario-modal" data-confirm>
            {% csrf_token %}
            <p class="meta">Clique no usuário para designá-lo como responsável.</p>
            {% include "pedidos/_lista_responsaveis.html" %}
            <div class="modal-acoes">
                <button type="button" class="link-secundario" data-fechar><i class="bi bi-x-lg"></i> Cancelar</button>
            </div>
        </form>
    </div>
</div>
