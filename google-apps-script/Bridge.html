<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><title>API Bridge</title></head>
<body>
<!--
  Bridge.html — ponte postMessage <-> google.script.run.

  O SPA (GitHub Pages) incorpora esta página em um iframe oculto.
  Protocolo:
    parent → bridge : { type: "API_CALL",  id, action, token, payload }
    bridge → parent : { type: "BRIDGE_READY" } no load;
                       { type: "API_RESP", id, resp } para cada chamada.
-->
<script>
  // HtmlService renderiza este HTML DENTRO de iframes aninhados do Google
  // (userCodeAppPanel). "window.parent" direto é um frame do Google, não o
  // site. Portanto postamos para TODA a cadeia de ancestrais até o topo —
  // o SPA (que tem listener) receberá mesmo assim.
  function postar(dados) {
    try { window.top.postMessage(dados, "*"); } catch (e) {}
    var w = window;
    while (w && w.parent && w.parent !== w) {
      w = w.parent;
      try { w.postMessage(dados, "*"); } catch (e) {}
    }
  }

  // Avisa ao SPA que a ponte está no ar.
  postar({ type: "BRIDGE_READY" });

  window.addEventListener("message", function (ev) {
    var msg = ev.data;
    if (!msg || msg.type !== "API_CALL" || !msg.id) return;

    google.script.run
      .withSuccessHandler(function (resp) {
        postar({ type: "API_RESP", id: msg.id, resp: resp });
      })
      .withFailureHandler(function (err) {
        postar({
          type: "API_RESP",
          id: msg.id,
          resp: { ok: false, erro: String(err && err.message || err) },
        });
      })
      .rotearApi(msg.action || "", msg.token || "", JSON.stringify(msg.payload || {}));
  });
</script>
</body></html>
